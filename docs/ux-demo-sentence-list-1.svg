<svg xmlns="http://www.w3.org/2000/svg" width="438" height="922" viewBox="0 0 438 922"><defs><linearGradient id="g_veg_0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A4D2E"/><stop offset="1" stop-color="#00CC6A"/></linearGradient><linearGradient id="g_pachinko_1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D3D2B"/><stop offset="1" stop-color="#00A86B"/></linearGradient><linearGradient id="g_fictions_2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163B30"/><stop offset="1" stop-color="#00BF7A"/></linearGradient></defs><rect x="0" y="0" width="438" height="922" fill="#0a0a0a"/><rect x="44" y="76" width="350" height="76" rx="10" ry="10" fill="#111411" /><rect x="44" y="158" width="350" height="79" rx="10" ry="10" fill="#111411" /><rect x="44" y="243" width="350" height="60" rx="10" ry="10" fill="#111411" /><rect x="44" y="309" width="350" height="95" rx="10" ry="10" fill="#111411" /><rect x="44" y="410" width="350" height="60" rx="10" ry="10" fill="#111411" /><rect x="44" y="476" width="350" height="60" rx="10" ry="10" fill="#111411" /><rect x="44" y="542" width="350" height="79" rx="10" ry="10" fill="#111411" /><rect x="44" y="627" width="350" height="79" rx="10" ry="10" fill="#111411" /><rect x="44" y="712" width="350" height="95" rx="10" ry="10" fill="#111411" /><rect x="44" y="813" width="350" height="79" rx="10" ry="10" fill="#111411" /><text x="44" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#FFFFFF">기록한 문장·생각</text><text x="159.5" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#7D8878">1,230</text><text x="384" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#B8C2B2">✕</text><text x="86" y="101" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"그녀는 이제 스스로 나무라고 생각한다."</text><text x="86" y="123" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#B8C2B2">💭 사람이길 거부하는 방식이 인상적이다</text><text x="86" y="140" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">채식주의자 · 한강 · p.142 · 3시간 전</text><rect x="56" y="100.5" width="20" height="27" rx="3" ry="3" fill="url(#g_veg_0)"/><text x="86" y="183" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"역사는 우리를 실망시켰지만, 그래도</text><text x="86" y="202" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">상관없다."</text><text x="86" y="225" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">파친코 · 이민진 · p.88 · 어제</text><rect x="56" y="184.0" width="20" height="27" rx="3" ry="3" fill="url(#g_pachinko_1)"/><text x="86" y="268" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"언니, 내가 물구나무서면 잎이 나온다니까."</text><text x="86" y="291" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">채식주의자 · 한강 · p.138 · 어제</text><rect x="56" y="259.5" width="20" height="27" rx="3" ry="3" fill="url(#g_veg_0)"/><text x="86" y="334" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"거울과 아버지는 혐오스럽다. 인간의 수를</text><text x="86" y="353" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">늘리기 때문이다."</text><text x="86" y="375" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#B8C2B2">💭 거울이 복제의 상징이라는 점이 섬뜩하다</text><text x="86" y="392" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">픽션들 · 보르헤스 · p.55 · 2일 전</text><rect x="56" y="343.0" width="20" height="27" rx="3" ry="3" fill="url(#g_fictions_2)"/><text x="86" y="435" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"선자는 눈을 감고 낯선 땅의 냄새를 맡았다."</text><text x="86" y="458" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">파친코 · 이민진 · p.34 · 2일 전</text><rect x="56" y="426.5" width="20" height="27" rx="3" ry="3" fill="url(#g_pachinko_1)"/><text x="86" y="501" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"거부의 시작이 꿈이라는 건 의지가 아니다."</text><text x="86" y="524" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">채식주의자 · 한강 · p.120 · 3일 전</text><rect x="56" y="492.5" width="20" height="27" rx="3" ry="3" fill="url(#g_veg_0)"/><text x="86" y="567" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"미로는 하나의 도서관이며, 도서관은 하나의</text><text x="86" y="586" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">미로다."</text><text x="86" y="609" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">픽션들 · 보르헤스 · p.12 · 3일 전</text><rect x="56" y="568.0" width="20" height="27" rx="3" ry="3" fill="url(#g_fictions_2)"/><text x="86" y="652" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"가족을 지키는 일에는 이유가 필요하지</text><text x="86" y="671" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">않았다."</text><text x="86" y="694" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">파친코 · 이민진 · p.112 · 4일 전</text><rect x="56" y="653.0" width="20" height="27" rx="3" ry="3" fill="url(#g_pachinko_1)"/><text x="86" y="737" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"이상하게도 내 몸이, 이 육체가 낯설게</text><text x="86" y="756" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">느껴져."</text><text x="86" y="778" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#B8C2B2">💭 스스로도 설명 못 할 이물감</text><text x="86" y="795" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">채식주의자 · 한강 · p.45 · 4일 전</text><rect x="56" y="746.0" width="20" height="27" rx="3" ry="3" fill="url(#g_veg_0)"/><text x="86" y="838" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"시간은 갈라지고 또 갈라져, 서로 만나지 않는</text><text x="86" y="857" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">미래들을 낳는다."</text><text x="86" y="880" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">픽션들 · 보르헤스 · p.88 · 5일 전</text><rect x="56" y="839.0" width="20" height="27" rx="3" ry="3" fill="url(#g_fictions_2)"/></svg>