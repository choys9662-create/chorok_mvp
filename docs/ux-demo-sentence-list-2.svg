<svg xmlns="http://www.w3.org/2000/svg" width="438" height="1002" viewBox="0 0 438 1002"><defs><linearGradient id="g_veg_0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A4D2E"/><stop offset="1" stop-color="#00CC6A"/></linearGradient><linearGradient id="g_pachinko_1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D3D2B"/><stop offset="1" stop-color="#00A86B"/></linearGradient><linearGradient id="g_fictions_2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163B30"/><stop offset="1" stop-color="#00BF7A"/></linearGradient></defs><rect x="0" y="0" width="438" height="1002" fill="#0a0a0a"/><rect x="44" y="76" width="350" height="227" rx="10" ry="10" fill="#111411" /><line x1="44" y1="142" x2="394" y2="142" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="44" y="313" width="350" height="224" rx="10" ry="10" fill="#111411" /><line x1="44" y1="379" x2="394" y2="379" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="44" y="547" width="350" height="204" rx="10" ry="10" fill="#111411" /><line x1="44" y1="613" x2="394" y2="613" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="44" y="761" width="350" height="207" rx="10" ry="10" fill="#111411" /><line x1="44" y1="827" x2="394" y2="827" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="44" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#FFFFFF">기록한 문장·생각</text><text x="159.5" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#7D8878">1,230</text><text x="384" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#B8C2B2">✕</text><rect x="60" y="90" width="28" height="38" rx="4" ry="4" fill="url(#g_veg_0)"/><text x="100" y="105" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">채식주의자 · 한강</text><text x="100" y="120" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">6월 28일 독서 · 42분 · 3문장</text><text x="60" y="169" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"그녀는 이제 스스로 나무라고 생각한다."</text><text x="60" y="183" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.142</text><text x="60" y="206" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#B8C2B2">💭 사람이길 거부하는 방식이 인상적이다</text><text x="60" y="231" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"언니, 내가 물구나무서면 잎이 나온다니까."</text><text x="60" y="245" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.138</text><text x="60" y="270" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"손에서 뿌리가 나오고, 다리 사이에서 꽃이</text><text x="60" y="289" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">핀다니까."</text><text x="60" y="303" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.139</text><rect x="60" y="327" width="28" height="38" rx="4" ry="4" fill="url(#g_pachinko_1)"/><text x="100" y="342" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">파친코 · 이민진</text><text x="100" y="357" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">어제 독서 · 25분 · 4문장</text><text x="60" y="406" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"역사는 우리를 실망시켰지만, 그래도 상관없다."</text><text x="60" y="420" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.88</text><text x="60" y="445" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"선자는 눈을 감고 낯선 땅의 냄새를 맡았다."</text><text x="60" y="459" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.34</text><text x="60" y="484" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"가족을 지키는 일에는 이유가 필요하지 않았다."</text><text x="60" y="498" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.112</text><text x="60" y="523" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"그들은 이방인으로 살아남는 법을 배워야 했다."</text><text x="60" y="537" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.201</text><rect x="60" y="561" width="28" height="38" rx="4" ry="4" fill="url(#g_veg_0)"/><text x="100" y="576" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">채식주의자 · 한강</text><text x="100" y="591" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">6월 26일 독서 · 51분 · 3문장</text><text x="60" y="640" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"거부의 시작이 꿈이라는 건 의지가 아니다."</text><text x="60" y="654" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.120</text><text x="60" y="679" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"이상하게도 내 몸이, 이 육체가 낯설게 느껴져."</text><text x="60" y="693" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.45</text><text x="60" y="718" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"피 냄새가 온몸에 배어 있는 것 같아 견딜 수가</text><text x="60" y="737" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">없어."</text><text x="60" y="751" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.61</text><rect x="60" y="775" width="28" height="38" rx="4" ry="4" fill="url(#g_fictions_2)"/><text x="100" y="790" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">픽션들 · 보르헤스</text><text x="100" y="805" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">6월 24일 독서 · 33분 · 2문장</text><text x="60" y="854" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"거울과 아버지는 혐오스럽다. 인간의 수를 늘리기</text><text x="60" y="873" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">때문이다."</text><text x="60" y="887" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.55</text><text x="60" y="910" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#B8C2B2">💭 거울이 복제의 상징이라는 점이 섬뜩하다</text><text x="60" y="935" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"미로는 하나의 도서관이며, 도서관은 하나의</text><text x="60" y="954" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">미로다."</text><text x="60" y="968" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.12</text></svg>