<svg xmlns="http://www.w3.org/2000/svg" width="438" height="1039" viewBox="0 0 438 1039"><defs><linearGradient id="g_veg_0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A4D2E"/><stop offset="1" stop-color="#00CC6A"/></linearGradient><linearGradient id="g_pachinko_1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D3D2B"/><stop offset="1" stop-color="#00A86B"/></linearGradient><linearGradient id="g_fictions_2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#163B30"/><stop offset="1" stop-color="#00BF7A"/></linearGradient></defs><rect x="0" y="0" width="438" height="1039" fill="#0a0a0a"/><rect x="44" y="76" width="350" height="340" rx="10" ry="10" fill="#111411" /><line x1="44" y1="137" x2="394" y2="137" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="44" y="426" width="350" height="228" rx="10" ry="10" fill="#111411" /><line x1="44" y1="487" x2="394" y2="487" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><rect x="44" y="664" width="350" height="341" rx="10" ry="10" fill="#111411" /><line x1="44" y1="725" x2="394" y2="725" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="44" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#FFFFFF">기록한 문장·생각</text><text x="159.5" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#7D8878">1,230</text><text x="384" y="52" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="400" fill="#B8C2B2">✕</text><rect x="60" y="90" width="24" height="33" rx="3" ry="3" fill="url(#g_veg_0)"/><text x="94" y="108" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">채식주의자 · 한강</text><text x="338.0" y="108" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#7D8878">18문장</text><text x="60" y="164" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"그녀는 이제 스스로 나무라고 생각한다."</text><text x="60" y="178" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.142</text><text x="60" y="201" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"언니, 내가 물구나무서면 잎이 나온다니까."</text><text x="60" y="215" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.138</text><text x="60" y="238" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"거부의 시작이 꿈이라는 건 의지가 아니다."</text><text x="60" y="252" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.120</text><text x="60" y="275" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"이상하게도 내 몸이, 이 육체가 낯설게 느껴져."</text><text x="60" y="289" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.45</text><text x="60" y="312" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"피 냄새가 온몸에 배어 있는 것 같아 견딜 수가</text><text x="60" y="331" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">없어."</text><text x="60" y="345" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.61</text><text x="60" y="368" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"나는 나무를 닮고 싶다는 생각을 멈출 수가</text><text x="60" y="387" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">없다."</text><text x="60" y="401" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.150</text><text x="60" y="424" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#7D8878">그 외 12개 더보기 ›</text><rect x="60" y="440" width="24" height="33" rx="3" ry="3" fill="url(#g_pachinko_1)"/><text x="94" y="458" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">파친코 · 이민진</text><text x="344.5" y="458" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#7D8878">7문장</text><text x="60" y="514" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"역사는 우리를 실망시켰지만, 그래도 상관없다."</text><text x="60" y="528" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.88</text><text x="60" y="551" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"선자는 눈을 감고 낯선 땅의 냄새를 맡았다."</text><text x="60" y="565" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.34</text><text x="60" y="588" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"가족을 지키는 일에는 이유가 필요하지 않았다."</text><text x="60" y="602" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.112</text><text x="60" y="625" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"그들은 이방인으로 살아남는 법을 배워야 했다."</text><text x="60" y="639" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.201</text><text x="60" y="662" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#7D8878">그 외 3개 더보기 ›</text><rect x="60" y="678" width="24" height="33" rx="3" ry="3" fill="url(#g_fictions_2)"/><text x="94" y="696" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">픽션들 · 보르헤스</text><text x="338.0" y="696" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#7D8878">52문장</text><text x="60" y="752" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"거울과 아버지는 혐오스럽다. 인간의 수를 늘리기</text><text x="60" y="771" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">때문이다."</text><text x="60" y="785" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.55</text><text x="60" y="808" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"미로는 하나의 도서관이며, 도서관은 하나의</text><text x="60" y="827" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">미로다."</text><text x="60" y="841" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.12</text><text x="60" y="864" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"시간은 갈라지고 또 갈라져, 서로 만나지 않는</text><text x="60" y="883" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">미래들을 낳는다."</text><text x="60" y="897" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.88</text><text x="60" y="920" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"글을 쓴다는 것은 이미 존재하는 책을 발견하는</text><text x="60" y="939" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">일에 가깝다."</text><text x="60" y="953" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.130</text><text x="60" y="976" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF">"무한한 것 앞에서 인간의 언어는 초라해진다."</text><text x="60" y="990" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="10" font-weight="400" fill="#7D8878">p.201</text><text x="60" y="1013" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="400" fill="#7D8878">그 외 47개 더보기 ›</text></svg>