<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초록 — 완독 책꽂이 UX 데모</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #060B07;
  color: white;
  font-family: -apple-system, 'Helvetica Neue', 'Malgun Gothic', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── 헤더 ─────────────────────────────────────────────────── */
.header {
  padding: 28px 28px 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-shrink: 0;
}

.header-left {}

.header-eyebrow {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.header-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-stats {
  text-align: right;
}

.stats-cm {
  font-size: 32px;
  font-weight: 800;
  color: #00FF66;
  letter-spacing: -1.5px;
  line-height: 1;
  text-shadow: 0 0 20px rgba(0,255,102,0.4);
}

.stats-label {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  margin-top: 4px;
}

/* ── 토글 탭 ─────────────────────────────────────────────── */
.toggle-bar {
  display: flex;
  gap: 6px;
  padding: 0 28px 20px;
  flex-shrink: 0;
}

.toggle-btn {
  padding: 8px 18px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: 0.2px;
}

.toggle-btn.active {
  background: rgba(0,255,102,0.14);
  color: #00FF66;
  box-shadow: 0 0 0 1px rgba(0,255,102,0.25);
}

.toggle-btn.inactive {
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.45);
}

.toggle-btn.inactive:hover {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
}

/* ── 책꽂이 뷰 ───────────────────────────────────────────── */
#spine-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
}

.shelf-scroll-area {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 48px 28px 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.shelf-scroll-area::-webkit-scrollbar { display: none; }

.books-row {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  min-width: max-content;
  padding-bottom: 0;
}

/* 개별 책 등판 */
.book-spine {
  position: relative;
  height: 210px;
  border-radius: 2px 5px 5px 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition:
    transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
    box-shadow 0.35s ease,
    filter 0.35s ease;
  flex-shrink: 0;
  overflow: hidden;
}

.book-spine::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.45) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.2) 100%);
  pointer-events: none;
}

.book-spine::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

.book-spine:hover::after { opacity: 1; }

.book-spine:hover {
  transform: translateY(-20px) scaleX(1.03);
  filter: brightness(1.2);
}

.book-spine.selected {
  transform: translateY(-24px) scaleX(1.05);
  filter: brightness(1.3);
}

.spine-inner {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 0;
  pointer-events: none;
}

.spine-title {
  font-size: 11.5px;
  font-weight: 700;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.8px;
  line-height: 1;
}

.spine-author {
  font-size: 9.5px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.3px;
}

.spine-pages {
  font-size: 9px;
  color: rgba(255,255,255,0.3);
}

/* 책꽂이 선반 */
.shelf-plank {
  height: 10px;
  background: linear-gradient(to bottom, #1D3521, #0D1A10);
  border-top: 1px solid rgba(0,255,102,0.12);
  box-shadow: 0 6px 24px rgba(0,0,0,0.9), 0 -1px 0 rgba(255,255,255,0.04);
  flex-shrink: 0;
}

.shelf-footer {
  padding: 14px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.shelf-hint {
  font-size: 11px;
  color: rgba(255,255,255,0.2);
}

.shelf-count {
  font-size: 11px;
  color: rgba(255,255,255,0.3);
}

.shelf-count span {
  color: #00FF66;
  font-weight: 700;
}

/* ── 별자리 뷰 ───────────────────────────────────────────── */
#constellation-view {
  flex: 1;
  position: relative;
  display: none;
}

#constellation-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

.constellation-hint {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  white-space: nowrap;
}

/* ── 상세 바텀시트 ─────────────────────────────────────────── */
.overlay-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.overlay-bg.visible {
  opacity: 1;
  pointer-events: all;
}

.bottom-sheet {
  background: #0E1F11;
  border-radius: 24px 24px 0 0;
  padding: 0 28px 32px;
  width: 100%;
  max-width: 520px;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  border-top: 1px solid rgba(0,255,102,0.08);
  box-shadow: 0 -20px 60px rgba(0,0,0,0.8);
}

.overlay-bg.visible .bottom-sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 36px;
  height: 4px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  margin: 16px auto 24px;
}

.sheet-book-row {
  display: flex;
  gap: 20px;
  margin-bottom: 24px;
  align-items: flex-start;
}

.sheet-cover {
  width: 88px;
  height: 124px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  box-shadow: 6px 6px 24px rgba(0,0,0,0.6);
}

.sheet-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
}

.sheet-cover-title {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.7);
  text-align: center;
  padding: 10px 8px;
  line-height: 1.4;
  position: relative;
  z-index: 1;
}

.sheet-info { flex: 1; padding-top: 4px; }

.sheet-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 5px;
  line-height: 1.3;
  letter-spacing: -0.3px;
}

.sheet-author {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 14px;
}

.sheet-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(0,255,102,0.1);
  color: #00FF66;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 100px;
  border: 1px solid rgba(0,255,102,0.2);
}

.sheet-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat-cell {
  background: rgba(255,255,255,0.04);
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.05);
}

.stat-val {
  font-size: 20px;
  font-weight: 800;
  color: #00FF66;
  letter-spacing: -0.5px;
  line-height: 1;
}

.stat-lbl {
  font-size: 10.5px;
  color: rgba(255,255,255,0.35);
  margin-top: 5px;
  letter-spacing: 0.3px;
}

.thickness-bar-wrap {
  margin-top: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 14px;
  padding: 16px;
  border: 1px solid rgba(255,255,255,0.05);
}

.thickness-bar-label {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}

.thickness-bar-label span { color: #00FF66; font-weight: 600; }

.thickness-track {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}

.thickness-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(to right, #00A844, #00FF66);
  transition: width 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
  box-shadow: 0 0 8px rgba(0,255,102,0.5);
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-left">
    <div class="header-eyebrow">완독 기록</div>
    <div class="header-title">나의 책꽂이</div>
  </div>
  <div class="header-stats">
    <div class="stats-cm" id="total-cm">—</div>
    <div class="stats-label">쌓인 독서의 두께</div>
  </div>
</div>

<!-- 뷰 전환 탭 -->
<div class="toggle-bar">
  <button class="toggle-btn active" id="btn-spine" onclick="switchView('spine')">📚 책꽂이</button>
  <button class="toggle-btn inactive" id="btn-constellation" onclick="switchView('constellation')">✦ 별자리</button>
</div>

<!-- 책꽂이 뷰 -->
<div id="spine-view">
  <div class="shelf-scroll-area">
    <div class="books-row" id="books-row"></div>
  </div>
  <div class="shelf-plank"></div>
  <div class="shelf-footer">
    <div class="shelf-hint">← 옆으로 스크롤</div>
    <div class="shelf-count"><span id="book-count">0</span>권 완독</div>
  </div>
</div>

<!-- 별자리 뷰 -->
<div id="constellation-view">
  <canvas id="constellation-canvas"></canvas>
  <div class="constellation-hint">책을 클릭하면 상세 정보를 볼 수 있어요</div>
</div>

<!-- 상세 바텀시트 -->
<div class="overlay-bg" id="overlay" onclick="handleOverlayClick(event)">
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-book-row">
      <div class="sheet-cover" id="s-cover">
        <div class="sheet-cover-title" id="s-cover-title"></div>
      </div>
      <div class="sheet-info">
        <div class="sheet-title" id="s-title"></div>
        <div class="sheet-author" id="s-author"></div>
        <div class="sheet-badge">✓ 완독</div>
      </div>
    </div>
    <div class="sheet-stats">
      <div class="stat-cell">
        <div class="stat-val" id="s-pages"></div>
        <div class="stat-lbl">페이지</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="s-thick"></div>
        <div class="stat-lbl">두께</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="s-date"></div>
        <div class="stat-lbl">완독월</div>
      </div>
    </div>
    <div class="thickness-bar-wrap">
      <div class="thickness-bar-label">
        전체 책꽂이 중 두께 비율 <span id="s-ratio"></span>
      </div>
      <div class="thickness-track">
        <div class="thickness-fill" id="s-bar" style="width:0%"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── 책 데이터 ─────────────────────────────────────────────────────────────
const BOOKS = [
  { title: '채식주의자',        author: '한강',            pages: 247, date: "'23.03", c1: '#1B3B1B', c2: '#2D6A2D' },
  { title: '소년이 온다',       author: '한강',            pages: 216, date: "'23.07", c1: '#182A3A', c2: '#2A4F72' },
  { title: '82년생 김지영',     author: '조남주',          pages: 190, date: "'23.10", c1: '#3A1E1E', c2: '#6E2E2E' },
  { title: '아몬드',            author: '손원평',          pages: 264, date: "'23.12", c1: '#28183A', c2: '#502E72' },
  { title: '파친코',            author: '이민진',          pages: 496, date: "'24.02", c1: '#183A28', c2: '#2E7250' },
  { title: '데미안',            author: '헤르만 헤세',     pages: 203, date: "'24.04", c1: '#3A3018', c2: '#72602E' },
  { title: '죄와 벌',          author: '도스토예프스키',  pages: 860, date: "'24.07", c1: '#3A1818', c2: '#722E2E' },
  { title: '노르웨이의 숲',     author: '무라카미 하루키', pages: 389, date: "'24.09", c1: '#12283A', c2: '#20507A' },
  { title: '달러구트 꿈 백화점',author: '이미예',          pages: 312, date: "'24.11", c1: '#203A28', c2: '#3A724A' },
  { title: '나미야 잡화점의 기적', author: '히가시노 게이고', pages: 408, date: "'25.01", c1: '#3A2C18', c2: '#72562E' },
  { title: '불편한 편의점',     author: '김호연',          pages: 288, date: "'25.03", c1: '#1A2A3A', c2: '#2E507A' },
  { title: '아내를 모자로 착각한 남자', author: '올리버 색스', pages: 352, date: "'25.04", c1: '#2A1A3A', c2: '#52306A' },
];

// 페이지 수 → 두께(mm) — 페이퍼백 기준 1mm ≈ 3페이지
const pagesToMm = (p) => p / 3;
// 페이지 수 → 책꽂이 등판 너비(px)
const pagesToWidth = (p) => Math.max(28, Math.min(105, p / 4.8));

// ── 전체 통계 계산 ────────────────────────────────────────────────────────
const totalMm = BOOKS.reduce((s, b) => s + pagesToMm(b.pages), 0);
const totalCm = (totalMm / 10).toFixed(1);

// ── 책꽂이 렌더링 ─────────────────────────────────────────────────────────
function renderSpine() {
  document.getElementById('total-cm').textContent = totalCm + ' cm';
  document.getElementById('book-count').textContent = BOOKS.length;

  const row = document.getElementById('books-row');
  row.innerHTML = '';

  BOOKS.forEach((book) => {
    const w = pagesToWidth(book.pages);
    const div = document.createElement('div');
    div.className = 'book-spine';
    div.style.cssText = `
      width: ${w}px;
      background: linear-gradient(160deg, ${book.c1} 0%, ${book.c2} 100%);
      box-shadow: inset -3px 0 6px rgba(0,0,0,0.5), 3px 0 12px rgba(0,0,0,0.4);
    `;
    div.innerHTML = `
      <div class="spine-inner">
        <span class="spine-title">${book.title}</span>
        ${w > 40 ? `<span class="spine-author">${book.author.split(' ')[0]}</span>` : ''}
        ${w > 60 ? `<span class="spine-pages">${book.pages}p</span>` : ''}
      </div>
    `;
    div.addEventListener('click', () => openDetail(book));
    row.appendChild(div);
  });
}

// ── 상세 시트 ─────────────────────────────────────────────────────────────
function openDetail(book) {
  // 표지
  const cover = document.getElementById('s-cover');
  cover.style.background = `linear-gradient(135deg, ${book.c1}, ${book.c2})`;
  document.getElementById('s-cover-title').textContent = book.title;

  // 텍스트
  document.getElementById('s-title').textContent = book.title;
  document.getElementById('s-author').textContent = book.author;
  document.getElementById('s-pages').textContent = book.pages.toLocaleString();
  document.getElementById('s-date').textContent = book.date;

  const mm = pagesToMm(book.pages);
  const cm = (mm / 10).toFixed(1);
  document.getElementById('s-thick').textContent = cm + 'cm';

  const ratio = (mm / totalMm * 100).toFixed(1);
  document.getElementById('s-ratio').textContent = ratio + '%';

  // 바 애니메이션 — 한 프레임 딜레이 후 적용
  const bar = document.getElementById('s-bar');
  bar.style.width = '0%';
  setTimeout(() => { bar.style.width = ratio + '%'; }, 50);

  document.getElementById('overlay').classList.add('visible');
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('visible');
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeDetail();
}

// ── 별자리 뷰 ─────────────────────────────────────────────────────────────
let constellationDone = false;
let nodePositions = [];

function renderConstellation() {
  const canvas = document.getElementById('constellation-canvas');
  const container = document.getElementById('constellation-view');
  const W = canvas.width  = container.clientWidth;
  const H = canvas.height = container.clientHeight;
  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, W, H);

  // 배경 별들
  for (let i = 0; i < 160; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    const r = Math.random() * 1.3;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5 + 0.05})`;
    ctx.fill();
  }

  // 책 위치 배정 (ellipse 배열 + 약간의 jitter)
  const cx = W / 2, cy = H / 2;
  const rx = Math.min(W, H) * 0.35, ry = Math.min(W, H) * 0.28;
  nodePositions = BOOKS.map((book, i) => {
    const angle = (i / BOOKS.length) * Math.PI * 2 - Math.PI / 2;
    const jx = (Math.random() - 0.5) * 55;
    const jy = (Math.random() - 0.5) * 40;
    return { x: cx + Math.cos(angle) * rx + jx, y: cy + Math.sin(angle) * ry + jy, book };
  });

  // 같은 저자 선 연결
  const byAuthor = {};
  nodePositions.forEach(n => {
    (byAuthor[n.book.author] = byAuthor[n.book.author] || []).push(n);
  });
  Object.values(byAuthor).forEach(group => {
    if (group.length < 2) return;
    for (let a = 0; a < group.length; a++) {
      for (let b = a + 1; b < group.length; b++) {
        const g = ctx.createLinearGradient(group[a].x, group[a].y, group[b].x, group[b].y);
        g.addColorStop(0, 'rgba(0,255,102,0.35)');
        g.addColorStop(1, 'rgba(0,255,102,0.35)');
        ctx.beginPath();
        ctx.moveTo(group[a].x, group[a].y);
        ctx.lineTo(group[b].x, group[b].y);
        ctx.strokeStyle = g;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  });

  // 책 노드
  nodePositions.forEach(({ x, y, book }) => {
    const r = Math.max(22, Math.min(40, book.pages / 17));

    // 외곽 글로우
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.8);
    glow.addColorStop(0, 'rgba(0,255,102,0.18)');
    glow.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(x, y, r * 2.8, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // 코어
    const core = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, 0, x, y, r);
    core.addColorStop(0, book.c2);
    core.addColorStop(1, book.c1);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = core;
    ctx.fill();

    // 테두리
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,255,102,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 제목
    const fs = Math.max(9, Math.min(12.5, r / 2.8));
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = `700 ${fs}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const short = book.title.length > 5 ? book.title.slice(0, 5) + '…' : book.title;
    ctx.fillText(short, x, y);

    // 저자명
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = `${Math.max(8, r * 0.28)}px -apple-system, sans-serif`;
    ctx.fillText(book.author.split(' ')[0], x, y + r + 14);
  });

  constellationDone = true;
}

// 별자리 클릭 히트 테스트
document.getElementById('constellation-canvas').addEventListener('click', (e) => {
  if (!constellationDone) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (const { x, y, book } of nodePositions) {
    const r = Math.max(22, Math.min(40, book.pages / 17));
    if ((mx - x) ** 2 + (my - y) ** 2 <= (r + 8) ** 2) {
      openDetail(book);
      break;
    }
  }
});

// ── 뷰 전환 ──────────────────────────────────────────────────────────────
function switchView(view) {
  const spineEl        = document.getElementById('spine-view');
  const constellEl     = document.getElementById('constellation-view');
  const btnSpine       = document.getElementById('btn-spine');
  const btnConstell    = document.getElementById('btn-constellation');

  if (view === 'spine') {
    spineEl.style.display     = 'flex';
    constellEl.style.display  = 'none';
    btnSpine.className    = 'toggle-btn active';
    btnConstell.className = 'toggle-btn inactive';
  } else {
    spineEl.style.display     = 'none';
    constellEl.style.display  = 'block';
    btnSpine.className    = 'toggle-btn inactive';
    btnConstell.className = 'toggle-btn active';
    renderConstellation();
  }
}

// ── 초기화 ────────────────────────────────────────────────────────────────
renderSpine();
</script>
</body>
</html>
