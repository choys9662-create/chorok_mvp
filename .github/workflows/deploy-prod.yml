name: Build & Deploy PROD to Firebase Hosting

# 실사용 환경 — chorok-real.web.app
# 실 Supabase 키 + 구글 로그인 사용.
# Firebase Console에서 chorok-real 사이트가 먼저 생성되어 있어야 동작합니다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Deploy to chorok-real (prod)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Create .env from secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }
          test -n "${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}" || { echo "Missing GOOGLE_CLOUD_VISION_API_KEY secret"; exit 1; }
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "ALADIN_API_KEY=${{ secrets.ALADIN_API_KEY }}" >> .env
          echo "GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (real)
        # 웹 Google 로그인은 Supabase OAuth redirect로 처리. Google client ID는
        # Supabase 대시보드의 Google provider 설정에 등록되어 있으면 됨.
        run: >
          flutter build web --release
          --dart-define=GOOGLE_CLOUD_VISION_API_KEY=${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}

      - name: Deploy to Firebase Hosting (prod)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          target: prod
