name: Build & Deploy PROD to Firebase Hosting

# 실사용 환경 — chorok-real.web.app
# 실 Supabase 키 + 구글 로그인 사용.
# Firebase Console에서 chorok-real 사이트가 먼저 생성되어 있어야 동작합니다.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Deploy to chorok-real (prod)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 배포 전 게이트 — analyze/test 실패 시 이후 배포 단계로 진행하지 않는다.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      # 운영 migration history가 rebaseline되기 전에는 CI에서 db push를 실행하지 않는다.
      # rebaseline과 dry-run 검증을 마친 뒤에만 명시적 DB 게이트를 다시 추가한다.

      - name: Deploy Edge Functions
        # aladin-search/naver-userinfo-proxy는 회수한 소스 검토와 Aladin 키 회전 전까지
        # 이 워크플로에서 배포하지 않는다.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing SUPABASE_PROJECT_ID secret"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GEMINI_API_KEY secret"; exit 1; }
          supabase secrets set \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            GEMINI_OCR_MODEL="gemini-2.5-flash" \
            --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy gemini-ocr \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Create .env from secrets
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Build Flutter Web (real)
        # 웹 Google 로그인은 Supabase OAuth redirect로 처리. Google client ID는
        # Supabase 대시보드의 Google provider 설정에 등록되어 있으면 됨.
        run: >
          flutter build web --release
          --dart-define=APP_MODE=test
          --dart-define=USE_MOCK=false

      - name: Deploy to Firebase Hosting (prod)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          target: prod
