name: chorok_app
description: "초록 - 독서 몰입 플랫폼"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 라우팅
  go_router: ^14.6.2

  # 백엔드 (Supabase)
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1

  # HTTP 클라이언트 (알라딘 Open API)
  http: ^1.2.2

  # 로컬 DB (sqflite — Isar 3.1이 Dart 3.11 analyzer 미지원으로 대체)
  sqflite: ^2.3.3
  path: ^1.9.0

  # 바코드 스캐너 (ISBN-13)
  mobile_scanner: ^7.0.0

  # 로컬 저장소 (온보딩 완료 여부)
  shared_preferences: ^2.3.3

  # 화면 켜짐 유지 (독서 세션)
  wakelock_plus: ^1.3.4

  # OCR (카메라 촬영 → 텍스트 추출)
  image_picker: ^1.1.2
  # google_mlkit_text_recognition: ^0.14.0 # 시뮬레이터 빌드 문제로 임시 주석 처리

  # STT (음성 → 텍스트)
  speech_to_text: ^7.0.0

  # 공유 카드 이미지 공유
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # 소셜 로그인 + 딥링크
  sign_in_with_apple: ^6.1.4
  google_sign_in: ^6.2.2
  app_links: ^6.3.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - .env

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
