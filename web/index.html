<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- 색상은 lib/core/theme/app_theme.dart의 AppTheme.darkBg와 동기화 -->
  <meta name="theme-color" content="#121212">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="chorok_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>chorok_app</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var hash = window.location.hash || '';
      var isAuthCallback =
        hash.indexOf('access_token=') !== -1 ||
        hash.indexOf('refresh_token=') !== -1 ||
        hash.indexOf('error=') !== -1;

      if (isAuthCallback) {
        window.location.replace('https://chorok-web.web.app/' + hash);
      }
    })();

    (function () {
      function updateViewportHeight() {
        document.documentElement.style.setProperty(
          '--chorok-app-height',
          window.innerHeight + 'px'
        );
      }

      updateViewportHeight();
      window.addEventListener('resize', updateViewportHeight);
      window.addEventListener('orientationchange', updateViewportHeight);
    })();
  </script>
  <style>
    :root {
      --chorok-safe-top: env(safe-area-inset-top, 0px);
      --chorok-safe-right: env(safe-area-inset-right, 0px);
      --chorok-safe-bottom: env(safe-area-inset-bottom, 0px);
      --chorok-safe-left: env(safe-area-inset-left, 0px);
      background-color: #121212;
      height: 100%;
      overflow: hidden;
    }

    html {
      background-color: #121212;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--chorok-app-height, 100dvh);
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body > flt-glass-pane,
    body > flutter-view {
      position: absolute !important;
      top: var(--chorok-safe-top) !important;
      right: var(--chorok-safe-right) !important;
      bottom: var(--chorok-safe-bottom) !important;
      left: var(--chorok-safe-left) !important;
      width: auto !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
